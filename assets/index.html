<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copilot de mates</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
<header class="bar">
  <button class="icon" id="more" aria-expanded="false" aria-controls="panel"><span data-i18n="more_panel">Menú</span></button>
  <div class="progress" id="progress" hidden>
    <div class="label" id="progress-label"></div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" id="progress-track"><div class="fill" id="progress-fill"></div></div>
  </div>
</header>

<aside id="panel" class="panel" hidden>
  <section class="panel-block">
    <div class="who" id="who"></div>
    <div class="row">
      <span class="lang" role="group" aria-label="CA / EN"><button id="lang-cat" class="on">CA</button><button id="lang-eng">EN</button></span>
      <button class="icon" id="theme" aria-live="polite"><span id="theme-label">◐</span></button>
    </div>
    <!-- rung 0: the same statement in the other language, under the text; not a hint, no use spent -->
    <button class="secondary small translate" id="translate" title="esglaó 0" hidden></button>
  </section>
  <section class="panel-block">
    <h2 data-i18n="mastery">El teu progrés</h2>
    <div class="mastery" id="mastery"></div>
  </section>
  <section class="panel-block">
    <h2 data-i18n="board_led">La placa</h2>
    <canvas id="led" class="led" width="260" height="160" title="LED 8x13"></canvas>
  </section>
  <section class="panel-block">
    <details id="timing">
      <summary data-i18n="timing">Temps (per al professor)</summary>
      <div class="meta" id="problem-id"></div>
      <table id="timeline"></table>
      <div class="meta" id="load"></div>
    </details>
  </section>
  <section class="panel-block links">
    <a class="teacher" href="teacher.html" data-i18n="teacher">Vista del professor</a>
    <button class="secondary small" id="reset" data-i18n="reset" hidden>Canvia d'alumne</button>
  </section>
</aside>

<main id="start">
  <section class="start">
    <h1 data-i18n="welcome">Hola! Com et dius?</h1>
    <div class="field"><span id="alias-label" data-i18n="student">Àlies</span>
      <input id="student" maxlength="32" placeholder="per exemple: Mar" autocomplete="off" aria-labelledby="alias-label"></div>
    <div class="field"><span id="course-label" data-i18n="course">Curs</span>
      <select id="level" hidden aria-hidden="true"></select>
      <div class="dropdown">
        <button type="button" class="dd-button" id="level-button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="course-label level-text"><span id="level-text"></span><span class="dd-caret" aria-hidden="true"></span></button>
        <ul class="dd-list" id="level-list" role="listbox" aria-labelledby="course-label" tabindex="-1" hidden></ul>
      </div></div>
    <p class="meta" data-i18n="course_help">Si no tries cap curs, el copilot l'endevina.</p>
    <button class="primary big" id="begin" data-i18n="begin">Comença</button>
  </section>
</main>

<main id="app" hidden>
  <div class="meta" id="meta">…</div>
  <!-- the problem, in three parts: the statement as text, the figure cut out of the scan, the options -->
  <div class="problem">
    <figure class="figure" id="figure" hidden><img id="img" alt=""></figure>
    <div class="text" id="text"></div>
    <div class="other" id="other" hidden>
      <div class="kind" id="other-kind"></div>
      <div class="other-text" id="other-text"></div>
      <div class="options-text" id="other-options"></div>
    </div>
  </div>
  <figure class="figure strip" id="strip" hidden><img id="strip-img" alt=""></figure>
  <div class="letters" id="letters"></div>
  <!-- the whole scan, one click away, in case a cut goes wrong on the projector -->
  <div class="scan-tools"><button class="link" id="whole-toggle" hidden></button></div>
  <figure class="figure whole" id="whole" hidden><img id="whole-img" alt=""></figure>
  <section class="help">
    <div class="hints" id="hints"></div>
    <div class="manip-box" id="manip-box" hidden>
      <div class="bar-row"><b id="manip-title"></b><button class="secondary small" id="manip-close" data-i18n="close">Tanca</button></div>
      <iframe id="manip-frame" title="manipulative"></iframe>
    </div>
  </section>
</main>

<!-- the action sheet: hint and solution on the left, the verdict in the middle, continue on the right -->
<div class="sheet" id="feedback" aria-live="polite" hidden>
  <div class="inner">
    <div class="left">
      <div class="verdict" id="verdict"></div>
      <div class="status" id="status"></div>
      <div class="row"><button class="link" id="solution" data-i18n="solution">Solució</button><button class="secondary manip-btn" id="manip" hidden></button></div>
    </div>
    <div class="right">
      <button class="primary" id="next" data-i18n="next" hidden>Continua</button>
      <button class="secondary" id="hint"><span id="hint-label">Pista</span></button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
