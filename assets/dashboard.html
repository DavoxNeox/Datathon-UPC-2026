<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadre de decisions</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
<style>
  /* Decision dashboard: one question per panel, the measurement, the conclusion, the decision.
     No network, no libraries: the board is offline. Data is embedded below with its source. */
  main.dash { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
  .dash h1 { font-size: 26px; margin: 18px 0 6px; }
  .dash .lede { color: var(--muted); max-width: 72ch; margin: 0 0 18px; }
  .dash .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .dash .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .dash .tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .dash .tile .v { font-size: 34px; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
  .dash .tile .s { font-size: 12px; color: var(--muted); }
  .dash section.q { border-top: 1px solid var(--line); padding: 22px 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 22px; }
  @media (max-width: 760px) { .dash section.q { grid-template-columns: 1fr; } }
  .dash .ql { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 4px; }
  .dash h2 { font-size: 18px; margin: 0 0 10px; }
  .dash .chart { position: relative; }
  .dash .chart svg { width: 100%; height: auto; display: block; }
  .dash .chart text { font: 12px system-ui, sans-serif; fill: var(--muted); }
  .dash .chart text.val { fill: var(--ink); font-weight: 600; }
  .dash .tip { position: absolute; display: none; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; white-space: nowrap; z-index: 2; }
  .dash .verdict { display: grid; gap: 12px; align-content: start; }
  .dash .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.45; }
  .dash .box .h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .dash .box.decision { border-left: 4px solid var(--ok); }
  .dash .box.decision.open { border-left-color: #8a5a00; }
  .dash .box.decision.closed { border-left-color: var(--muted); }
  .dash .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .dash table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  .dash th, .dash td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .dash th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .dash td.r, .dash th.r { text-align: right; }
  .dash .wrap { overflow-x: auto; }
  .dash .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); }
  .dash .pill.shipped { color: var(--ok); } .dash .pill.open { color: #8a5a00; } .dash .pill.closed { color: var(--muted); }
  .dash .src { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .dash .foot { color: var(--muted); font-size: 12px; margin-top: 26px; }
  .dash .langbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
  .dash .langbar a { text-decoration: none; }
  .dash button.lang { font: inherit; min-height: 44px; min-width: 44px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .dash button.lang[aria-pressed="true"] { background: var(--ink); color: var(--card); }
</style>
</head>
<body>
<main class="dash">
  <div class="langbar">
    <a href="teacher.html" id="back">← <span data-t="back"></span></a>
    <span><button class="lang" id="lang-ca" aria-pressed="true">CA</button> <button class="lang" id="lang-en" aria-pressed="false">EN</button></span>
  </div>
  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="tiles" id="tiles"></div>
  <div id="panels"></div>
  <p class="foot" data-t="foot"></p>
</main>

let lang = "ca";

const t = (k, vars) => (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, v) => vars && v in vars ? vars[v] : "");

const L = (row, key) => row[key + "_" + lang] ?? row[key];
const SVGNS = "http://www.w3.org/2000/svg";

function tipOf(box) { let tp = box.querySelector(".tip"); if (!tp) { tp = h("div", "tip"); box.appendChild(tp); } return tp; }

// Horizontal bars drawn to one scale; every label names a reached value.
function hbars(box, rows, label, value, o) {

  const w = Math.max(320, box.clientWidth || 600), rowH = 26, top = 8, hgt = top + rows.length * rowH + 40;

    svg.appendChild(rect); attachTip(box, rect, `${label(r)}: ${f1(value(r))}${o.unit}`);
    svg.appendChild(el("text", {x: x(value(r)) + 5, y: y + 17, class: "val"}, f1(value(r)) + o.unit)); });
  o.refs.forEach((rf, i) => { svg.appendChild(el("line", {x1: x(rf.v), x2: x(rf.v), y1: top, y2: hgt - 34, style: "stroke:var(--muted);stroke-dasharray:4 3"})); svg.appendChild(el("text", {x: x(rf.v) + (i % 2 ? 4 : -4), y: hgt - 20 + (i % 2) * 14, "text-anchor": i % 2 ? "start" : "end"}, rf.t)); });

function topicsChart(box) {

    svg.appendChild(el("rect", {x: x(0), y: y + 15, width: x(r.d) - x(0), height: 6, rx: 2, style: "fill:#8a8a8a"}));

  svg.appendChild(el("line", {x1: x(20), x2: x(20), y1: top, y2: hgt - 22, style: "stroke:var(--muted);stroke-dasharray:4 3"}));
  svg.appendChild(el("text", {x: x(20), y: hgt - 6, "text-anchor": "middle"}, t("legendTopics")));

}
function ramChart(box) {
  const rows = DATA.ram.rows, total = DATA.ram.total, w = Math.max(320, box.clientWidth || 600); const svg = el("svg", {viewBox: `0 0 ${w} 110`, role: "img", "aria-label": rows.map(r => `${L(r, "c")} ${r.mb} MB`).join("; ")});
  const colors = ["var(--accent)", "#7c5cff", "#2a9d8f"]; const x = v => w * v / total; let acc = 0;
  rows.filter(r => !r.free).forEach((r, i) => { const rect = el("rect", {x: x(acc), y: 8, width: Math.max(0, x(r.mb)), height: 26, style: "fill:" + colors[i]}); svg.appendChild(rect); attachTip(box, rect, `${L(r, "c")}: ${r.mb} MB`); const lbl = `${L(r, "c")} ${r.mb} MB`; if (x(r.mb) > lbl.length * 7 + 12) svg.appendChild(el("text", {x: x(acc) + 6, y: 26, class: "val", style: "fill:#fff"}, lbl)); acc += r.mb; });

  svg.appendChild(el("text", {x: x(total - free.mb) + 6, y: 64, class: "val"}, `${L(free, "c")} ${free.mb} MB`));
  svg.appendChild(el("text", {x: 0, y: 100}, "0 MB")); svg.appendChild(el("text", {x: w, y: 100, "text-anchor": "end"}, `${total} MB`));

function table(cols, rows, keyf) { const wrap = h("div", "wrap"); const tb = h("table"); const thead = h("thead"); const tr = h("tr"); cols.forEach(c => { const th = h("th", c.r ? "r" : "", c.h); tr.appendChild(th); }); thead.appendChild(tr); tb.appendChild(thead); const body = h("tbody"); rows.forEach(r => { const row = h("tr"); cols.forEach(c => { const td = h("td", c.r ? "r" : ""); const v = c.v(r); if (c.pill) { const p = h("span", "pill " + v, v); td.appendChild(p); } else td.textContent = v == null ? "—" : String(v); row.appendChild(td); }); body.appendChild(row); }); tb.appendChild(body); wrap.appendChild(tb); return wrap; }

  const box = h("div", "chart"); left.appendChild(box); if (extra) extra(left); left.appendChild(h("p", "src", `${t("source")}: ${chartFn.src}`));
  const right = h("div", "verdict"); const c = h("div", "box"); c.appendChild(h("div", "h", t("conclusion"))); c.appendChild(document.createTextNode(conclusion)); right.appendChild(c);
  const d = h("div", "box decision " + (status || "")); d.appendChild(h("div", "h", t("decision"))); d.appendChild(document.createTextNode(decision)); right.appendChild(d);

function render() {
  document.documentElement.lang = lang; document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.getElementById("lang-ca").setAttribute("aria-pressed", lang === "ca"); document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
  const P = DATA.policies.rows, val = P.filter(r => r.set === "val"), g = (set, i) => P.filter(r => r.set === set)[i];
  const worst = DATA.latency.rows.find(r => r.worst).s, free = DATA.ram.rows.find(r => r.free).mb;
  const tiles = document.getElementById("tiles"); tiles.replaceChildren();
  [[t("t1"), f1(val[2].acc) + "%", t("t1s")], [t("t2"), f1(val[0].acc) + "%", t("t2s")], [t("t3"), f1(g("board", 1).acc) + "%", t("t3s", {w: f1(worst)})], [t("t4"), free + " MB", t("t4s")]].forEach(([k, v, s]) => { const d = h("div", "tile"); d.appendChild(h("div", "k", k)); d.appendChild(h("div", "v", v)); d.appendChild(h("div", "s", s)); tiles.appendChild(d); });
  document.getElementById("panels").replaceChildren();
  const polFn = box => { hbars(box, val, r => L(r, "policy"), r => r.acc, {max: 35, left: 230, unit: "%", refs: [{v: 20, t: t("floorRand")}, {v: 23.1, t: t("floorD")}], color: r => r.kind === "llm" ? "#8a8a8a" : r.kind === "floor" ? "#b0b0b0" : "var(--accent)"});
    const b2 = h("div", "chart"); b2.style.marginTop = "14px"; box.parentNode.insertBefore(b2, box.nextSibling); b2.insertAdjacentElement("beforebegin", h("p", "ql", t("q1b")));
    hbars(b2, DATA.confidence.rows, r => L(r, "q"), r => r.acc, {max: 35, left: 170, unit: "%", refs: [{v: 20, t: t("floorRand")}], color: r => r.acc < 20 ? "#c0392b" : "var(--accent)"}); };

  const solFn = box => box.replaceChildren(table([{h: t("thFam"), v: r => r.family}, {h: t("thCls"), v: r => r.c, r: 1}, {h: t("thFire"), v: r => r.f, r: 1}, {h: t("thR"), v: r => r.r, r: 1}, {h: t("thW"), v: r => r.w, r: 1}], DATA.solvers.rows)); solFn.src = DATA.solvers.src;
  panel("q-solvers", 3, t("q3"), solFn, t("c3", {f: DATA.solvers.rows.reduce((a, r) => a + r.f, 0)}), t("d3"), "closed", left => left.appendChild(h("p", "src", t("s3"))));
  const hintFn = box => hbars(box, DATA.hints.rows, r => `${L(r, "m")} (${r.v}/${r.of})`, r => 100 * r.v / r.of, {max: 100, left: 330, unit: "%", color: r => r.bad ? "#c0392b" : "var(--accent)"}); hintFn.src = DATA.hints.src;
  const H = DATA.hints.rows; panel("q-hints", 4, t("q4"), hintFn, t("c4", {a: H[0].v, b: H[1].v, c: H[2].v, d: H[4].v}), t("d4"), "shipped");
  const latFn = box => hbars(box, DATA.latency.rows, r => L(r, "step"), r => r.s, {max: 65, left: 320, unit: " s", refs: [{v: 60, t: t("limit")}], color: r => r.s > 30 ? "#8a5a00" : "var(--accent)"}); latFn.src = DATA.latency.src;
  panel("q-latency", 5, t("q5"), latFn, t("c5", {a: f1(DATA.latency.rows[2].s)}), t("d5", {b: f1(worst)}), "shipped");

}
