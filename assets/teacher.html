<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista del professor</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* The teacher's view: the class at a glance, then one student diagnosed from every answer
       recorded (topic, level, letter, hints, time). Charts are inline SVG drawn here; no library,
       nothing fetched: the board is offline. Same tokens and buttons as the student page. */
    main.teacher { max-width: 1100px; padding-bottom: 48px; }
    .teacher h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
    .teacher h3 { font-size: 15px; margin: 0 0 8px; }
    .teacher section.block { margin: 18px 0 26px; }
    .teacher .meta { margin: 0 0 10px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0 0 14px; }
    .tile { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; min-height: 92px; }
    .tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
    .tile .v { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; margin: 4px 0 2px; }
    .tile .s { font-size: 12px; color: var(--muted); font-weight: 600; }
    .tile.good .v { color: var(--ok); } .tile.bad .v { color: var(--bad); } .tile.warn .v { color: var(--warn); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 12px; }
    .card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
    .card.wide { grid-column: 1 / -1; }
    .card svg { width: 100%; height: auto; display: block; overflow: visible; }
    .card svg text { font: 600 12px ui-rounded, "SF Pro Rounded", system-ui, sans-serif; fill: var(--muted); }
    .card svg text.ink { fill: var(--ink); font-weight: 800; }
    .card svg text.small { font-size: 11px; }
    .card .note { font-size: 12px; color: var(--muted); font-weight: 600; margin: 8px 0 0; }
    .who { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
    .who .dropdown { width: min(100%, 360px); }
    .who .since { font-size: 14px; color: var(--muted); font-weight: 600; }
    .diag { border-left: 6px solid var(--accent); }
    .diag ul { margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.45; }
    .diag li { margin: 4px 0; } .diag li.good::marker { color: var(--ok); } .diag li.bad::marker { color: var(--bad); } .diag li.warn::marker { color: var(--warn); }
    .scroll { overflow-x: auto; }
    table.grid { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; width: 100%; }
    table.grid th, table.grid td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; }
    table.grid th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    table.grid th:first-child, table.grid td:first-child { text-align: left; }
    table.grid tbody tr { cursor: pointer; } table.grid tbody tr:hover td:first-child { text-decoration: underline; }
    table.grid tr.on td:first-child { font-weight: 800; color: var(--accent); }
    /* mastery 0..5: from "no data" to "one level above", in the page's own tints */
    td.m0 { background: var(--card-2); color: var(--muted); } td.m1 { background: var(--bad-bg); color: var(--bad); } td.m2 { background: var(--warn-bg); color: var(--warn); }
    td.m3 { background: var(--accent-soft); } td.m4 { background: var(--ok-bg); } td.m5 { background: var(--ok-bg); color: var(--ok); font-weight: 800; }
    .legend span { display: inline-block; margin-right: 12px; font-size: 13px; color: var(--muted); font-weight: 600; }
    table.stats { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
    table.stats td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.stats td:first-child { font-weight: 800; width: 34%; } table.stats td.val { white-space: nowrap; font-weight: 800; width: 20%; }
    table.stats td.how { color: var(--muted); font-size: 12px; font-weight: 600; }
    .empty { color: var(--muted); font-weight: 600; padding: 12px 0; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tools a.icon { display: inline-flex; align-items: center; text-decoration: none; }
    @media (max-width: 700px) { .bar { flex-wrap: wrap; gap: 8px; } .tile .v { font-size: 26px; } }
  </style>
</head>
<body>
<header class="bar">
  <div class="brand"><span id="title">Vista del professor</span></div>
  <div class="tools">
    <a class="icon" href="index.html" id="back">Pàgina de l'alumne</a>
    <a class="icon" href="dashboard.html" id="dash">Quadre de decisions</a>
    <span class="lang" role="group" aria-label="CA / EN"><button id="lang-cat" class="on">CA</button><button id="lang-eng">EN</button></span>
  </div>
</header>
<main class="teacher">
  <section class="block" id="class-block">
    <h2 id="h-class"></h2>
    <p class="meta" id="source"></p>
    <div class="tiles" id="class-tiles"></div>
    <div class="cards">
      <div class="card wide">
        <h3 id="h-mastery"></h3>
        <div class="scroll"><table class="grid" id="mastery"></table></div>
        <p class="legend" id="legend"></p>
      </div>
      <div class="card"><h3 id="h-class-levels"></h3><div id="class-levels"></div></div>
      <div class="card"><h3 id="h-class-topics"></h3><div id="class-topics"></div></div>
    </div>
  </section>

  <section class="block" id="student-block">
    <h2 id="h-student"></h2>
    <div class="who">
      <div class="dropdown">
        <button class="dd-button" id="who-button" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="who-label"></span><span class="dd-caret" aria-hidden="true"></span></button>
        <ul class="dd-list" id="who-list" role="listbox" hidden></ul>
      </div>
      <span class="since" id="since"></span>
    </div>
    <div id="student"></div>
  </section>

  <section class="block" id="rung0-section">
    <h2 id="h-rung0"></h2>
    <p class="meta" id="rung0-help"></p>
    <p id="rung0-summary"></p>
    <div class="scroll"><table class="grid" id="rung0"></table></div>
    <p class="meta" id="rung0-caveat"></p>
  </section>
</main>
<script>

const SVGNS = "http://www.w3.org/2000/svg";
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const RUNGS = [0, 1, 2, 3, 4];

const I18N = {
  cat: {title: "Vista del professor", back: "Pàgina de l'alumne", dash: "Quadre de decisions",

                 days: "Activitat per dia (últims 14 dies)", levels: "Encerts per nivell", stats: "Estadístics avançats", diag: "Diagnòstic",
                 rolling: "encerts dels últims 5", level_line: "nivell del problema", chance: "atzar (20 %)", acc_rung: "encerts"},
        rungs: ["sense pista", "problema veí", "estratègia", "pas a pas", "solució"],

                weak: ["Tema més fluix", "amb 3 respostes o més"], strong: ["Tema més fort", "amb 3 respostes o més"],
                solution: ["Mira la solució", "part de les respostes donades després de veure la solució"],

               guess: "Possible resposta a l'atzar: els encerts no es distingeixen del 20 % o sempre tria la mateixa lletra.",
               hintdep: "Depèn de les pistes: encerta amb ajuda però no sense. Convé repassar el tema abans de continuar.",
               up: d => `Millora: ${d} punts més en les últimes 10 respostes.`, down: d => `Empitjora: ${d} punts menys en les últimes 10 respostes; pot ser cansament.`,
               fast: s => `Respon molt de pressa (${s} s de mediana): potser no llegeix l'enunciat.`,
               slow: s => `Triga molt (${s} de mediana): pot necessitar l'estratègia abans de començar.`,
               weak: (tp, p) => `Reforça ${tp}: ${p} % d'encerts.`, strong: (tp, p) => `${tp} dominat: ${p} % d'encerts.`,
               solution: p => `Mira la solució en el ${p} % dels problemes.`, rung0: n => `Fa servir l'esglaó 0 (${n} vegades): la llengua hi pesa.`,
               level: (l, n) => `Nivell de treball ${l}; el repte és el ${n}.`},
        rung0_title: "Esglaó 0 · lectura en l'altre idioma",
        rung0_help: "Abans de cap pista, l'alumne pot llegir el mateix enunciat en anglès (o en català). No compta com a pista per al domini: separa \"no entenc l'enunciat\" de \"no sé resoldre'l\".",
        rung0_summary: (u, n, k) => `${u} de ${n} alumnes l'han fet servir, ${k} vegades en total.`,
        rung0_none: "Encara cap alumne amb respostes.",

        uses: "Vegades", problems: "Problemes", acc_with: "Encerts després de l'esglaó 0", acc_without: "Encerts sense l'esglaó 0",
        units: {s: "s", min: "min", pp: "punts", n: "n"}},
  eng: {title: "Teacher view", back: "Student page", dash: "Decision dashboard",
        h_class: "The class", h_student: "The student", mastery: "Mastery by topic and student", levels: "Correct answers by level",
        class_topics: "Correct answers by topic (whole class)",

                 rolling: "correct among the last 5", level_line: "problem level", chance: "chance (20 %)", acc_rung: "correct"},
        rungs: ["no hint", "neighbour problem", "strategy", "step by step", "solution"],
        stats: {acc: ["Accuracy with confidence interval", "Wilson 95 %: where the true rate lies given this many answers"],
                clean: ["Accuracy without any hint", "what mastery uses: correct with no help"],
                hintdep: ["Hint dependence", "accuracy after a hint over accuracy without; above 1.5 the hints do the work"],
                trend: ["Trend", "last 10 answers against the 10 before, in points; p of a two-proportion test"],
                slope: ["Learning slope", "linear regression of correctness on answer order, in points per 10 answers"],
                guess: ["Guessing index", "chi-square of the letters chosen (4 df) and accuracy against 20 % chance"],
                time: ["Time per problem", "median gap between consecutive answers (breaks over 10 min dropped)"],
                streaks: ["Streaks", "longest run of correct and of wrong answers"],
                zpd: ["Working level", "highest level with at least half correct over 3 or more answers; the next one is the challenge"],
                weak: ["Weakest topic", "with 3 answers or more"], strong: ["Strongest topic", "with 3 answers or more"],
                solution: ["Looks at the solution", "share of answers given after seeing the solution"],
                rung0: ["Rung 0", "times the statement was read in the other language; accuracy after / without"]},
        diag: {few: n => `Little data: ${n} answers. From 5 on the diagnosis is reliable.`,
               high: p => `Masters the current work (${p} % correct): ready to move up a level.`,
               mid: p => `Right working zone (${p} % correct): neither too easy nor too hard.`,
               low: p => `Too hard (${p} % correct): move down a level or reinforce with the neighbour problem.`,
               guess: "Possible guessing: accuracy is not distinguishable from 20 %, or the same letter is always chosen.",
               hintdep: "Depends on hints: correct with help but not without. Review the topic before going on.",
               up: d => `Improving: ${d} points more over the last 10 answers.`, down: d => `Getting worse: ${d} points fewer over the last 10 answers; may be tiredness.`,
               fast: s => `Answers very fast (median ${s} s): may not be reading the statement.`,
               slow: s => `Takes long (median ${s}): may need the strategy before starting.`,
               weak: (tp, p) => `Reinforce ${tp}: ${p} % correct.`, strong: (tp, p) => `${tp} mastered: ${p} % correct.`,
               solution: p => `Looks at the solution on ${p} % of the problems.`, rung0: n => `Uses rung 0 (${n} times): language weighs.`,
               level: (l, n) => `Working level ${l}; the challenge is ${n}.`},
        rung0_title: "Rung 0 · reading in the other language",
        rung0_help: "Before any hint the student can read the same statement in English (or in Catalan). It is not a hint for mastery: it separates \"I don't understand the statement\" from \"I can't solve it\".",
        rung0_summary: (u, n, k) => `${u} of ${n} students used it, ${k} times in all.`,
        rung0_none: "No student with answers yet.",
        rung0_caveat: (nw, nwo) => `Observational comparison, not a controlled experiment: each student chooses when to use rung 0, often on the problems they already find hard. n = ${nw} answers after rung 0 and ${nwo} without. To measure its effect, see the protocol in docs/teach-measurement.md.`,
        uses: "Uses", problems: "Problems", acc_with: "Correct after rung 0", acc_without: "Correct without rung 0",
        units: {s: "s", min: "min", pp: "points", n: "n"}},
};
let lang = new URLSearchParams(location.search).get("lang") === "eng" ? "eng" : "cat", data = null;
let who = new URLSearchParams(location.search).get("student") || null;
const t = () => I18N[lang];
const topicName = key => { const tp = (data.topics || []).find(x => x.key === key); return tp ? (lang === "cat" ? tp.name_ca : tp.name_en) : key; };

// ---------------------------------------------------------------- statistics
const pct = (k, n) => n ? Math.round(100 * k / n) : null;
const fmtPct = v => v == null ? "–" : `${v} %`;
function wilson(k, n, z = 1.96) {
  if (!n) return [0, 0];
  const p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
  return [Math.max(0, c - h), Math.min(1, c + h)];
}
function erf(x) {   // Abramowitz and Stegun 7.1.26
  const s = Math.sign(x), a = Math.abs(x), tt = 1 / (1 + .3275911 * a);
  const y = 1 - (((((1.061405429 * tt - 1.453152027) * tt) + 1.421413741) * tt - .284496736) * tt + .254829592) * tt * Math.exp(-a * a);
  return s * y;
}
const normalSf = z => .5 * (1 - erf(z / Math.SQRT2));           // P(Z > z)
const chi2Sf4 = x => Math.exp(-x / 2) * (1 + x / 2);              // survival of chi-square with 4 degrees of freedom
function twoProp(k1, n1, k2, n2) {
  if (!n1 || !n2) return null;
  const p = (k1 + k2) / (n1 + n2), se = Math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2));
  if (!se) return {diff: k1 / n1 - k2 / n2, p: 1};
  const z = (k1 / n1 - k2 / n2) / se;
  return {diff: k1 / n1 - k2 / n2, p: 2 * normalSf(Math.abs(z))};
}
function slope(ys) {   // least squares of y on index, per unit of index
  const n = ys.length; if (n < 3) return null;
  const mx = (n - 1) / 2, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0; ys.forEach((y, i) => { sxy += (i - mx) * (y - my); sxx += (i - mx) ** 2; });
  return sxx ? sxy / sxx : 0;
}
const median = xs => { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function runs(bools) {
  let best = [0, 0], cur = [0, 0];
  bools.forEach(b => { if (b) { cur[0]++; cur[1] = 0; } else { cur[1]++; cur[0] = 0; } best = [Math.max(best[0], cur[0]), Math.max(best[1], cur[1])]; });
  let current = 0; const last = bools[bools.length - 1];
  for (let i = bools.length - 1; i >= 0 && bools[i] === last; i--) current++;
  return {longestOk: best[0], longestBad: best[1], current: last === undefined ? 0 : (last ? current : -current)};
}
const fmtTime = s => s == null ? "–" : s < 90 ? `${Math.round(s)} ${t().units.s}` : `${(s / 60).toFixed(1)} ${t().units.min}`;
const dayKey = ts => { const d = new Date(ts * 1000); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

function analyse(name) {
  const log = (data.log && data.log.answers || []).filter(a => a.student_id === name);
  const meta = data.log && data.log.students && data.log.students[name] || {};
  const n = log.length, k = log.filter(a => a.correct).length;
  const clean = log.filter(a => a.hint_rung === 0), cleanK = clean.filter(a => a.correct).length;
  const hinted = log.filter(a => a.hint_rung > 0 && a.hint_rung < 4), hintedK = hinted.filter(a => a.correct).length;
  const afterSolution = log.filter(a => a.hint_rung === 4).length;
  const recent = log.slice(-10), previous = log.slice(-20, -10);
  const trend = twoProp(recent.filter(a => a.correct).length, recent.length, previous.filter(a => a.correct).length, previous.length);
  const gaps = []; for (let i = 1; i < n; i++) { const g = log[i].created_at - log[i - 1].created_at; if (g > 0 && g <= 600) gaps.push(g); }
  const letters = {A: 0, B: 0, C: 0, D: 0, E: 0}; log.forEach(a => { if (a.letter in letters) letters[a.letter]++; });
  const chi2 = n ? Object.values(letters).reduce((s, o) => s + (o - n / 5) ** 2 / (n / 5), 0) : 0;
  const zChance = n ? (k - .2 * n) / Math.sqrt(.16 * n) : 0;
  const byLevel = {}; log.forEach(a => { const b = byLevel[a.level] = byLevel[a.level] || {n: 0, k: 0}; b.n++; if (a.correct) b.k++; });
  const byTopic = {}; log.forEach(a => { const b = byTopic[a.topic] = byTopic[a.topic] || {n: 0, k: 0}; b.n++; if (a.correct) b.k++; });
  const byRung = RUNGS.map(r => { const xs = log.filter(a => a.hint_rung === r); return {n: xs.length, k: xs.filter(a => a.correct).length}; });
  const levelsOk = Object.entries(byLevel).filter(([, v]) => v.n >= 3 && v.k / v.n >= .5).map(([l]) => +l);
  const zpd = levelsOk.length ? Math.max(...levelsOk) : null;
  const topics3 = Object.entries(byTopic).filter(([, v]) => v.n >= 3).map(([key, v]) => ({key, acc: v.k / v.n, n: v.n})).sort((a, b) => a.acc - b.acc);
  const days = {}; log.forEach(a => { const d = dayKey(a.created_at); days[d] = (days[d] || 0) + 1; });
  const r0 = data.rung0 && data.rung0.by_student && data.rung0.by_student[name];

// ---------------------------------------------------------------- the diagnosis in words
function diagnose(s) {

  }
  if (s.n >= 8 && (s.pChance > .2 || (s.pLetters < .05 && s.acc < 40))) out.push(["bad", d.guess]);
  if (s.hinted.n >= 3 && s.clean.n >= 3 && s.hintRate >= 50 && pct(s.hinted.k, s.hinted.n) - pct(s.clean.k, s.clean.n) >= 25) out.push(["warn", d.hintdep]);

  if (s.zpd != null) out.push(["", d.level(s.zpd, Math.min(7, s.zpd + 1))]);
  if (s.weakest && s.weakest.acc < .4) out.push(["bad", d.weak(topicName(s.weakest.key), Math.round(100 * s.weakest.acc))]);

}

function renderClass() {

  // the advanced statistics, each with how it is computed
  const rows = [

    [ST.clean, s.clean.n ? `${fmtPct(pct(s.clean.k, s.clean.n))} (${s.clean.k}/${s.clean.n})` : "–"],

  ];
  const table = document.createElement("table"); table.className = "stats";
  table.innerHTML = rows.map(([[name, how], val]) => `<tr><td>${esc(name)}</td><td class="val">${esc(val)}</td><td class="how">${esc(how)}</td></tr>`).join("");
  grid.appendChild(card(t().charts.stats, table, "wide"));
  box.appendChild(grid);
}

function pctOf(c) { return c.answers ? `${c.correct}/${c.answers} (${Math.round(100 * c.correct / c.answers)}%)` : "–"; }
function renderRung0(r) {
  $("h-rung0").textContent = t().rung0_title; $("rung0-help").textContent = t().rung0_help;
  if (!r) { $("rung0-section").hidden = true; return; }
  $("rung0-section").hidden = false;
  const names = Object.keys(r.by_student || {}).sort();
  $("rung0-summary").textContent = names.length ? t().rung0_summary(r.students_using, r.students_total, r.uses) : t().rung0_none;
  $("rung0-caveat").textContent = t().rung0_caveat(r.with.answers, r.without.answers);
  const row = (name, c) => `<tr><td>${esc(name)}</td><td>${c.uses}</td><td>${c.problems}</td><td>${pctOf(c.with)}</td><td>${pctOf(c.without)}</td></tr>`;
  $("rung0").innerHTML = `<tr><th>${t().student}</th><th>${t().uses}</th><th>${t().problems}</th><th>${t().acc_with}</th><th>${t().acc_without}</th></tr>` +
    names.map(n => row(n, r.by_student[n])).join("") +
    (names.length > 1 ? row(t().all, {uses: r.uses, problems: names.reduce((a, n) => a + r.by_student[n].problems, 0), with: r.with, without: r.without}) : "");
}

function render() {
  if (!data) return;
  document.documentElement.lang = lang === "cat" ? "ca" : "en"; document.title = t().title;
  $("title").textContent = t().title; $("back").textContent = t().back; $("dash").textContent = t().dash;
  $("h-class").textContent = t().h_class; $("h-student").textContent = t().h_student; $("h-mastery").textContent = t().mastery;
  $("h-class-levels").textContent = t().levels; $("h-class-topics").textContent = t().class_topics;
  $("lang-cat").classList.toggle("on", lang === "cat"); $("lang-eng").classList.toggle("on", lang === "eng");
  $("source").textContent = (t().source[data.source] || data.source) + (data.error ? " · " + data.error : "") + (data.log_error ? " · " + data.log_error : "");
  renderWho();
  renderClass();
  renderStudent();
  renderRung0(data.rung0);
}
async function load() { try { data = await (await fetch("/api/teacher")).json(); } catch (e) { return; } render(); }   // a server restart: keep the last picture
$("lang-cat").onclick = () => { lang = "cat"; render(); }; $("lang-eng").onclick = () => { lang = "eng"; render(); };
load(); setInterval(load, 3000);
</script>
</body>
</html>
