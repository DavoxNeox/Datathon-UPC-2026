<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista del professor</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <style>
    main.teacher { max-width: 920px; }
    main.teacher section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; margin-bottom: 14px; }
    main.teacher h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .scroll { overflow-x: auto; }
    table.grid { border-collapse: collapse; font-size: 15px; }
    table.grid th, table.grid td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; }
    table.grid th:first-child, table.grid td:first-child { text-align: left; }
    /* mastery 0..5: from "no data" to "one level above", in the page's own tints */
    td.m0 { background: var(--card-2); color: var(--muted); } td.m1 { background: var(--bad-bg); color: var(--bad); } td.m2 { background: var(--warn-bg); color: var(--warn); }
    td.m3 { background: var(--accent-soft); } td.m4 { background: var(--ok-bg); } td.m5 { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
    .legend span { display: inline-block; margin-right: 12px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<header class="bar">
  <div class="brand"><span id="title">Vista del professor</span></div>
  <div class="tools">
    <a class="icon" href="index.html" id="back" style="display: inline-flex; align-items: center; text-decoration: none">Pàgina de l'alumne</a>
    <span class="lang" role="group" aria-label="CA / EN"><button id="lang-cat" class="on">CA</button><button id="lang-eng">EN</button></span>
    <button class="icon" id="theme"><span id="theme-label">◐</span></button>
  </div>
</header>
<main class="teacher">
  <section>
    <h2 id="h-mastery">Domini per tema i alumne</h2>
    <div class="meta" id="source"></div>
    <div class="scroll"><table class="grid" id="mastery"></table></div>
    <p class="legend" id="legend"></p>
  </section>
  <section id="levels-section" hidden>
    <h2 id="h-levels">Encerts per nivell</h2>
    <div class="scroll"><table class="grid" id="levels"></table></div>
  </section>
  <section id="rung0-section">
    <h2 id="h-rung0">Esglaó 0 · lectura en l'altre idioma</h2>
    <p class="meta" id="rung0-help"></p>
    <p id="rung0-summary"></p>
    <div class="scroll"><table class="grid" id="rung0"></table></div>
    <p class="meta" id="rung0-caveat"></p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const I18N = {
  cat: {title: "Vista del professor", back: "Pàgina de l'alumne", mastery: "Domini per tema i alumne", levels: "Encerts per nivell",
        student: "Alumne", level: "Nivell", correct: "Encerts", total: "Intents",
        rung0: "Esglaó 0 · lectura en l'altre idioma",
        rung0_help: "Abans de cap pista, l'alumne pot llegir el mateix enunciat en anglès (o en català). No compta com a pista per al domini: separa \"no entenc l'enunciat\" de \"no sé resoldre'l\".",
        rung0_summary: (u, n, k) => `${u} de ${n} alumnes l'han fet servir, ${k} vegades en total.`,
        rung0_none: "Encara cap alumne amb respostes.",
        rung0_caveat: (nw, nwo) => `Comparació observacional, no un experiment controlat: cada alumne tria quan fa servir l'esglaó 0, sovint als problemes que ja li costen. n = ${nw} respostes després de l'esglaó 0 i ${nwo} sense. Per mesurar-ne l'efecte, el protocol de docs/teach-measurement.md.`,
        uses: "Vegades", problems: "Problemes", acc_with: "Encerts després de l'esglaó 0", acc_without: "Encerts sense l'esglaó 0", all: "Tots",
        source: {mastery_map: "Dades: trainer.mastery_map (el trainer encara no publica teacher_report)", teacher_report: "Dades: trainer.teacher_report"},
        theme: {auto: "Tema: automàtic", light: "Tema: clar", dark: "Tema: fosc"},
        legend: ["0 sense dades", "1 sempre falla", "2 encerta amb pistes", "3 a vegades sense pistes", "4 sempre sense pistes", "5 encerta un nivell per sobre"]},
  eng: {title: "Teacher view", back: "Student page", mastery: "Mastery by topic and student", levels: "Correct answers by level",
        student: "Student", level: "Level", correct: "Correct", total: "Attempts",
        rung0: "Rung 0 · reading in the other language",
        rung0_help: "Before any hint the student can read the same statement in English (or in Catalan). It is not a hint for mastery: it separates \"I don't understand the statement\" from \"I can't solve it\".",
        rung0_summary: (u, n, k) => `${u} of ${n} students used it, ${k} times in all.`,
        rung0_none: "No student with answers yet.",
        rung0_caveat: (nw, nwo) => `Observational comparison, not a controlled experiment: each student chooses when to use rung 0, often on the problems they already find hard. n = ${nw} answers after rung 0 and ${nwo} without. To measure its effect, see the protocol in docs/teach-measurement.md.`,
        uses: "Uses", problems: "Problems", acc_with: "Correct after rung 0", acc_without: "Correct without rung 0", all: "All",
        source: {mastery_map: "Data: trainer.mastery_map (the trainer does not publish teacher_report yet)", teacher_report: "Data: trainer.teacher_report"},
        theme: {auto: "Theme: automatic", light: "Theme: light", dark: "Theme: dark"},
        legend: ["0 no data", "1 always fails", "2 correct with hints", "3 sometimes correct without hints", "4 consistently correct without hints", "5 correct one level above"]},
};
let lang = new URLSearchParams(location.search).get("lang") === "eng" ? "eng" : "cat", data = null;
const t = () => I18N[lang];
function render() {
  if (!data) return;
  document.documentElement.lang = lang === "cat" ? "ca" : "en"; document.title = t().title;
  $("title").textContent = t().title; $("back").textContent = t().back; $("h-mastery").textContent = t().mastery; $("h-levels").textContent = t().levels;
  $("lang-cat").classList.toggle("on", lang === "cat"); $("lang-eng").classList.toggle("on", lang === "eng");
  renderTheme();
  $("source").textContent = (t().source[data.source] || data.source) + (data.error ? " · " + data.error : "");
  const students = Object.keys(data.students || {}).sort();
  $("mastery").innerHTML = `<tr><th>${t().student}</th>${data.topics.map(tp => `<th>${esc(lang === "cat" ? tp.name_ca : tp.name_en)}</th>`).join("")}</tr>` +
    students.map(s => `<tr><td>${esc(s)}</td>${data.topics.map(tp => { const m = data.students[s][tp.key] ?? 0; return `<td class="m${m}">${m}</td>`; }).join("")}</tr>`).join("");
  $("legend").innerHTML = t().legend.map(l => `<span>${esc(l)}</span>`).join("");
  renderRung0(data.rung0);
  const lv = data.by_level;
  $("levels-section").hidden = !lv;
  if (lv) {
    // by_level: {student: {level: {"correct": n, "total": n}}} or {level: {"correct", "total"}}
    const nested = Object.values(lv).some(v => v && typeof v === "object" && Object.values(v).some(x => x && typeof x === "object" && "total" in x));
    const rows = nested ? Object.entries(lv) : [["*", lv]];
    const levels = [...new Set(rows.flatMap(([, byLevel]) => Object.keys(byLevel)))].sort((a, b) => a - b);
    $("levels").innerHTML = `<tr><th>${t().student}</th>${levels.map(l => `<th>${t().level} ${esc(l)}</th>`).join("")}</tr>` +
      rows.map(([s, byLevel]) => `<tr><td>${esc(s)}</td>${levels.map(l => { const c = byLevel[l]; return `<td>${c ? `${c.correct}/${c.total}` : "–"}</td>`; }).join("")}</tr>`).join("");
  }
}
const THEME_GLYPH = {auto: "◐", light: "☀", dark: "☾"};
function renderTheme() { const m = Theme.get(); $("theme-label").textContent = THEME_GLYPH[m]; $("theme").title = t().theme[m]; $("theme").setAttribute("aria-label", t().theme[m]); }
$("theme").onclick = () => { Theme.next(); renderTheme(); };
function pct(c) { return c.answers ? `${c.correct}/${c.answers} (${Math.round(100 * c.correct / c.answers)}%)` : "–"; }
function renderRung0(r) {
  $("h-rung0").textContent = t().rung0; $("rung0-help").textContent = t().rung0_help;
  if (!r) { $("rung0-section").hidden = true; return; }
  $("rung0-section").hidden = false;
  const names = Object.keys(r.by_student || {}).sort();
  $("rung0-summary").textContent = r.students_total ? t().rung0_summary(r.students_using, r.students_total, r.uses) : t().rung0_none;
  $("rung0-caveat").textContent = t().rung0_caveat(r.with.answers, r.without.answers);
  const row = (name, c) => `<tr><td>${esc(name)}</td><td>${c.uses}</td><td>${c.problems}</td><td>${pct(c.with)}</td><td>${pct(c.without)}</td></tr>`;
  $("rung0").innerHTML = `<tr><th>${t().student}</th><th>${t().uses}</th><th>${t().problems}</th><th>${t().acc_with}</th><th>${t().acc_without}</th></tr>` +
    names.map(n => row(n, r.by_student[n])).join("") +
    (names.length > 1 ? row(t().all, {uses: r.uses, problems: names.reduce((a, n) => a + r.by_student[n].problems, 0), with: r.with, without: r.without}) : "");
}
async function load() { data = await (await fetch("/api/teacher")).json(); render(); }
$("lang-cat").onclick = () => { lang = "cat"; render(); }; $("lang-eng").onclick = () => { lang = "eng"; render(); };
load(); setInterval(load, 3000);
</script>
</body>
</html>
