<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gira i volteja</title>
<link rel="stylesheet" href="../theme.css">
<script src="../theme.js"></script>
<style>
  body { margin: 0; padding: 14px; font: 16px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--card); }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 4px 0 10px; color: var(--muted); font-size: 14px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  canvas { border: 1px solid var(--line); border-radius: 6px; background: var(--card); touch-action: none; }
  .controls { display: flex; flex-direction: column; gap: 8px; }
  .controls .group { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.on { background: var(--accent-soft); border-color: var(--accent); }
  .label { font-size: 13px; color: var(--muted); }
  .quiz { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .quiz .opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .quiz canvas { width: 70px; height: 70px; cursor: pointer; }
  .quiz canvas.right { outline: 3px solid var(--ok); } .quiz canvas.wrong { outline: 3px solid var(--bad); }
  .verdict { font-weight: 600; min-height: 1.4em; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button { min-height: 44px; }
</style>
</head>
<body>
<h1 id="title">Gira i volteja</h1>
<p id="intro">Dibuixa una figura (clica les caselles) o tria'n una. Gira-la i volteja-la: què canvia i què no? Una rotació no és el mateix que un mirall.</p>
<div class="wrap">
  <div>
    <div class="label" id="l-orig">Figura</div>
    <canvas id="orig" width="200" height="200"></canvas>
  </div>
  <div>
    <div class="label" id="l-res">Resultat</div>
    <canvas id="res" width="200" height="200"></canvas>
    <div class="label" id="ops"></div>
  </div>
  <div class="controls">
    <div class="group" id="presets"></div>
    <div class="group">
      <button id="cw">↻ 90°</button><button id="ccw">↺ 90°</button><button id="r180">180°</button>
    </div>
    <div class="group">
      <button id="fh" title="mirall horitzontal">⇋ <span data-i18n="flipH">mirall</span></button>
      <button id="fv" title="mirall vertical">⇅ <span data-i18n="flipV">volteja</span></button>
      <button id="reset" data-i18n="reset">Torna a l'inici</button>
    </div>
    <button class="primary" id="quiz-btn" data-i18n="quiz">Posa'm a prova</button>
  </div>
</div>
<div class="quiz" id="quiz" hidden>
  <div id="q-text"></div>
  <div class="opts" id="q-opts"></div>
  <div class="verdict" id="q-verdict"></div>
</div>
<script>
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();  // theme tokens for canvas and inline colours
const lang = new URLSearchParams(location.search).get("lang") === "eng" ? "eng" : "cat";
const T = {
  cat: {title: "Gira i volteja", intro: "Dibuixa una figura (clica les caselles) o tria'n una. Gira-la i volteja-la: què canvia i què no? Una rotació no és el mateix que un mirall.",
        orig: "Figura", res: "Resultat", flipH: "mirall", flipV: "volteja", reset: "Torna a l'inici", quiz: "Posa'm a prova",
        q: "Quina d'aquestes és la figura girada 90° en sentit horari?", ok: "Molt bé! És la rotació.", bad: "No: aquesta és un mirall o una altra rotació. Segueix un punt concret de la figura.",
        ops: "Operacions: ", none: "cap"},
  eng: {title: "Rotate and flip", intro: "Draw a shape (click the cells) or pick one. Rotate and flip it: what changes and what stays? A rotation is not a mirror.",
        orig: "Shape", res: "Result", flipH: "mirror", flipV: "flip", reset: "Back to start", quiz: "Test me",
        q: "Which of these is the shape rotated 90° clockwise?", ok: "Well done! That is the rotation.", bad: "No: that one is a mirror or another rotation. Follow one specific point of the shape.",
        ops: "Operations: ", none: "none"},
}[lang];
document.documentElement.lang = lang === "cat" ? "ca" : "en"; document.title = T.title;
document.getElementById("title").textContent = T.title; document.getElementById("intro").textContent = T.intro;
document.getElementById("l-orig").textContent = T.orig; document.getElementById("l-res").textContent = T.res;
document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T[el.dataset.i18n]);

const N = 5;
const PRESETS = {
  F: ["#####", "#....", "####.", "#....", "#...."], R: ["####.", "#...#", "####.", "#.#..", "#..##"],
  7: ["#####", "....#", "...#.", "..#..", ".#..."], 2: [".###.", "#...#", "...#.", "..#..", "#####"],
  "→": ["..#..", "...#.", "#####", "...#.", "..#.."], L: ["#....", "#....", "#....", "#....", "#####"],
};
let shape = PRESETS.F.map(r => [...r].map(c => c === "#" ? 1 : 0)), result = shape.map(r => [...r]), ops = [];
const rotCW = g => g[0].map((_, c) => g.map(r => r[c]).reverse());
const rotCCW = g => rotCW(rotCW(rotCW(g)));
const flipH = g => g.map(r => [...r].reverse());
const flipV = g => [...g].reverse();
const same = (a, b) => a.every((r, i) => r.every((v, j) => v === b[i][j]));

function draw(canvas, g, cell) {
  const ctx = canvas.getContext("2d"), s = cell || canvas.width / N;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = g[r][c] ? css("--accent") : css("--card-2"); ctx.fillRect(c * s + 1, r * s + 1, s - 2, s - 2);
  }
  // a red dot marks one corner cell so the eye can follow it through the moves
  ctx.fillStyle = css("--bad"); const corner = findCorner(g); if (corner) ctx.beginPath(), ctx.arc(corner[1] * s + s / 2, corner[0] * s + s / 2, s / 7, 0, 7), ctx.fill();
}
function findCorner(g) { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (g[r][c]) return [r, c]; return null; }
function render() { draw(document.getElementById("orig"), shape); draw(document.getElementById("res"), result);
  document.getElementById("ops").textContent = T.ops + (ops.length ? ops.join(" → ") : T.none); }
function apply(fn, name) { result = fn(result); ops.push(name); render(); }
document.getElementById("cw").onclick = () => apply(rotCW, "↻90°");
document.getElementById("ccw").onclick = () => apply(rotCCW, "↺90°");
document.getElementById("r180").onclick = () => apply(g => rotCW(rotCW(g)), "180°");
document.getElementById("fh").onclick = () => apply(flipH, "⇋");
document.getElementById("fv").onclick = () => apply(flipV, "⇅");
document.getElementById("reset").onclick = () => { result = shape.map(r => [...r]); ops = []; render(); };
const presets = document.getElementById("presets");
for (const k of Object.keys(PRESETS)) { const b = document.createElement("button"); b.textContent = k; b.onclick = () => { shape = PRESETS[k].map(r => [...r].map(c => c === "#" ? 1 : 0)); result = shape.map(r => [...r]); ops = []; render(); }; presets.append(b); }
document.getElementById("orig").addEventListener("pointerdown", e => {
  const rect = e.target.getBoundingClientRect(), s = rect.width / N;
  const c = Math.floor((e.clientX - rect.left) / s), r = Math.floor((e.clientY - rect.top) / s);
  if (r >= 0 && r < N && c >= 0 && c < N) { shape[r][c] ^= 1; result = shape.map(x => [...x]); ops = []; render(); }
});
document.getElementById("quiz-btn").onclick = () => {
  const quiz = document.getElementById("quiz"); quiz.hidden = false;
  document.getElementById("q-text").textContent = T.q; document.getElementById("q-verdict").textContent = "";
  const answer = rotCW(shape);
  let candidates = [answer, flipH(shape), flipV(shape), rotCCW(shape)].filter((g, i, arr) => arr.findIndex(h => same(h, g)) === i && !same(g, shape));
  if (candidates.length < 2) candidates = [answer, flipH(rotCW(shape))];
  candidates.sort(() => Math.random() - 0.5);
  const opts = document.getElementById("q-opts"); opts.innerHTML = "";
  candidates.forEach(g => { const c = document.createElement("canvas"); c.width = c.height = 70; draw(c, g, 14);
    c.onclick = () => { const ok = same(g, answer); c.className = ok ? "right" : "wrong"; document.getElementById("q-verdict").textContent = ok ? T.ok : T.bad; document.getElementById("q-verdict").style.color = ok ? css("--ok") : css("--bad"); };
    opts.append(c); });
};
render();
</script>
</body>
</html>
